# Blueprint de Render. En Render: New > Blueprint > apunta al repo.
# Da un dominio HTTPS estable, que es lo que Meta necesita para el webhook
# y para la URL de política de privacidad.
#
# La base de datos NO se crea aquí a propósito: el Postgres gratuito de Render
# caduca 30 días después de crearse y luego se elimina con todos los datos.
# Usa Neon (gratuito y sin caducidad) y pega su cadena de conexión en
# DATABASE_URL desde el panel de Render. Ver WHATSAPP.md > "Base de datos".
services:
  - type: web
    name: signature-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # migrate deploy aplica migraciones pendientes sin pedir confirmación.
    preDeployCommand: pnpm db:migrate
    startCommand: node dist/src/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render inyecta PORT; appConfig ya lo lee.

      # Cadena de conexión de Neon, con ?sslmode=require al final.
      - key: DATABASE_URL
        sync: false

      # Los secretos van con sync: false para no comitearlos: se llenan en
      # el panel de Render (Environment).
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v25.0
      - key: WHATSAPP_VERIFY_SIGNATURE
        value: 'true'
      - key: LEGAL_BUSINESS_NAME
        value: Aura Signature
      - key: LEGAL_CONTACT_EMAIL
        sync: false

# Blueprint de Render. En Render: New > Blueprint > apunta al repo.
# Da un dominio HTTPS estable, que es lo que Meta necesita para el webhook
# y para la URL de política de privacidad.
#
# Sin rootDir a propósito: la raíz de este repositorio de Git es la carpeta api/,
# así que en GitHub el package.json ya está en la raíz.
#
# La base de datos NO se crea aquí, también a propósito: el Postgres gratuito de
# Render caduca 30 días después de crearse y luego se elimina con todos los datos.
# Usa Neon (gratuito y sin caducidad) y pega su cadena de conexión en
# DATABASE_URL. Ver WHATSAPP.md > "Dónde alojar la base de datos".
services:
  - type: web
    name: signature-api
    runtime: node
    plan: free
    region: oregon
    # Sin `corepack enable`: Render trae pnpm en /usr/bin/pnpm y corepack intenta
    # reemplazarlo, pero ese directorio es de sólo lectura (EROFS). Se invoca la
    # versión exacta con npx, que se descarga a la caché del usuario.
    #
    # Las migraciones van al final del build porque preDeployCommand no está
    # disponible en el plan gratuito. migrate deploy es idempotente: si no hay
    # migraciones pendientes, no hace nada.
    buildCommand: npx --yes pnpm@10.33.4 install --frozen-lockfile && npx --yes pnpm@10.33.4 build && npx --yes pnpm@10.33.4 db:migrate
    startCommand: node dist/src/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render inyecta PORT; appConfig ya lo lee.

      # Cadena de conexión de Neon, con ?sslmode=require al final.
      - key: DATABASE_URL
        sync: false

      # Los secretos van con sync: false para no comitearlos: Render los pide al
      # crear el Blueprint y luego se editan en Environment.
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v25.0
      - key: WHATSAPP_VERIFY_SIGNATURE
        value: 'true'
      - key: LEGAL_BUSINESS_NAME
        value: Aura Signature
      - key: LEGAL_CONTACT_EMAIL
        sync: false

      # Feed de catálogo para el Administrador de ventas de Meta.
      - key: PUBLIC_BASE_URL
        value: https://signature-api-x65k.onrender.com
      - key: CATALOG_BRAND
        value: Aura Signature
      - key: CATALOG_CURRENCY
        value: PEN
      - key: CATALOG_CONDITION
        value: new
      # Opcional: protege el feed con HTTP Basic. Sin definir = feed público.
      # Si las llenas, pon las mismas credenciales en el Administrador de ventas.
      - key: CATALOG_FEED_USER
        sync: false
      - key: CATALOG_FEED_PASSWORD
        sync: false
